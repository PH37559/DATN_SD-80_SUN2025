<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{/khach-hang/customer/index :: dynamic(~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>Tra cứu đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="mt-4">
    <div class="mx-auto" style="max-width: 1560px; padding: 20px">
        <div class="row text-center">
            <div class="bg-white rounded shadow-sm p-3 mb-4">
                <div class="lookup-form">
                    <h3>TRA CỨU ĐƠN HÀNG</h3>
                    <p>Vui lòng cung cấp thông tin để tra cứu đơn hàng.</p>
                    <form th:action="@{/home/find-order}" method="post">
                        <!-- Mã đơn -->
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Mã đơn</label>
                            <input type="text" id="orderId" name="id" class="form-control" placeholder="Nhập mã đơn" required>
                        </div>
                        <!-- SĐT -->
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Số điện thoại</label>
                            <input type="text" id="sdt" name="sdt" class="form-control" placeholder="Nhập số điện thoại" required>
                        </div>

                        <!-- Thông báo lỗi -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <!-- Nút tra cứu -->
                        <button type="submit" class="btn btn-warning">TRA CỨU NGAY</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="card shadow-sm mx-auto" style="max-width: 1560px; padding: 20px;">
        <div class="card-body p-0">
            <div class="d-flex flex-wrap gap-3 justify-content-start">
                <div class="product-card border rounded bg-white overflow-hidden"
                     style="width: 290px; height: 480px; padding: 12px;"
                     th:each="s : ${list}">
                    <div class="product-image-wrapper mb-3" style="height: 400px; overflow: hidden;">
                        <a th:href="@{'/home/san-pham-chi-tiet/' + ${s.id}}">
                            <img th:src="@{'/images/' + ${s.hinhAnh}}"
                                 alt="Ảnh sản phẩm"
                                 class="w-100"
                                 style="height: 100%; object-fit: cover;">
                        </a>
                    </div>
                    <div class="d-flex flex-column justify-content-between" style="height: 100px;">
                        <div class="product-title fs-5 fw-semibold text-truncate" th:text="${s.tenSach}">Tên sách</div>
                        <div class="product-price text-danger fw-bold fs-5"
                             th:text="${#numbers.formatDecimal(s.giaBan, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            726.000 đ
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <script>
            document.getElementById("lookupForm").addEventListener("submit", function (e) {
                e.preventDefault();

                const id = document.getElementById("orderId").value;
                if (!id) {
                    alert("Vui lòng nhập mã đơn!");
                    return;
                }

                // thay id vào URL
                this.action = `/home/orders/detail/${id}`;
                this.submit();
            });
        </script>
</main>

</body>
</html>
